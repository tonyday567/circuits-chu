- ignore: {name: "Use camelCase", within: Circuit.Logics.Laws}
- ignore: {name: "Use camelCase", within: Circuit.Diff.Daisyworld}
- ignore: {name: "Use camelCase", within: Circuit.Diff.DubinsChase}
